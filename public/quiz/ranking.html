<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>رتبه‌بندی</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet"
    type="text/css" />
  <link rel="stylesheet" href="styles.css">
  <style>
    .ranking-container {
      padding: 2rem;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .ranking-title {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 2rem;
      color: #4c6ef5;
      text-align: center;
    }

    .ranking-list {
      list-style: none;
      padding: 0;
    }

    .ranking-item {
      background-color: white;
      border-radius: 0.75rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 1rem;
      overflow: hidden;
      display: flex;
      align-items: center;
      padding: 1rem;
      transition: transform 0.2s ease-in-out;
    }

    .ranking-item:hover {
      transform: translateY(-5px);
    }

    .ranking-position {
      font-size: 1.5rem;
      font-weight: bold;
      color: #4c6ef5;
      margin-right: 1rem;
      min-width: 30px;
      text-align: center;
    }

    .ranking-profile {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      overflow: hidden;
      margin-right: 1rem;
      flex-shrink: 0;
      border: 2px solid #4c6ef5;
    }

    .ranking-profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ranking-username {
      font-size: 1.25rem;
      font-weight: 500;
      color: #2d3748;
      flex-grow: 1;
      text-align: right;
    }

    .ranking-score {
      font-size: 1.25rem;
      font-weight: bold;
      color: #38a169;
      margin-left: 1rem;
      min-width: 80px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="min-h-screen bg-gray-50 font-vazir text-right">
    <!-- Header -->
    <header class="flex justify-between items-center p-4 bg-white shadow-sm">
      <div class="flex items-center gap-2">
        <div class="relative w-10 h-10 rounded-full overflow-hidden">
          <img src="https://hebbkx1anhila5yf.public.blob.vercel-storage.com/image-eOJEvcsGZ7edRX7vPJv0MGrOHqJmsx.png"
            alt="Profile" class="object-cover" width="40" height="40">
        </div>
        <div>
          <h2 class="text-sm font-bold">خدایار خلیلی زاده</h2>
          <span class="text-xs text-blue-500">رشته ریاضی</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-amber-500 font-bold">2452</span>
        <span class="text-amber-500">🪙</span>
        <span>❤️ 5</span>
      </div>
    </header>

    <!-- Main Content - Ranking -->
    <main class="p-4 space-y-6">
      <div class="ranking-container">
        <h2 class="ranking-title">جدول رتبه‌بندی</h2>

        <ul class="ranking-list">
          <li class="ranking-item">
            <span class="ranking-position">1</span>
            <div class="ranking-profile">
              <img src="https://via.placeholder.com/50" alt="Profile">
            </div>
            <span class="ranking-username">علی</span>
            <span class="ranking-score">5680</span>
          </li>
          <li class="ranking-item">
            <span class="ranking-position">2</span>
            <div class="ranking-profile">
              <img src="https://via.placeholder.com/50" alt="Profile">
            </div>
            <span class="ranking-username">رضا</span>
            <span class="ranking-score">5200</span>
          </li>
          <li class="ranking-item">
            <span class="ranking-position">3</span>
            <div class="ranking-profile">
              <img src="https://via.placeholder.com/50" alt="Profile">
            </div>
            <span class="ranking-username">محمد</span>
            <span class="ranking-score">4800</span>
          </li>
          <li class="ranking-item">
            <span class="ranking-position">4</span>
            <div class="ranking-profile">
              <img src="https://via.placeholder.com/50" alt="Profile">
            </div>
            <span class="ranking-username">حسن</span>
            <span class="ranking-score">4500</span>
          </li>
          <li class="ranking-item">
            <span class="ranking-position">5</span>
            <div class="ranking-profile">
              <img src="https://via.placeholder.com/50" alt="Profile">
            </div>
            <span class="ranking-username">حسین</span>
            <span class="ranking-score">4200</span>
          </li>
        </ul>
      </div>
    </main>

    <!-- Footer Navigation -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t">
      <nav class="flex justify-around p-3">
        <button class="flex flex-col items-center gap-1 text-gray-500" data-tab="home">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
          <span class="text-xs">خانه</span>
        </button>
        <button id="game-island-btn" class="flex flex-col items-center gap-1 text-gray-500" data-tab="game-island">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
            <circle cx="12" cy="12" r="10" />
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" />
          </svg>
          <span class="text-xs">جزیره بازی</span>
        </button>
        <button id="education-btn" class="flex flex-col items-center gap-1 text-gray-500" data-tab="stats">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <span class="text-xs">آموزش</span>
        </button>
        <button id="ranking-btn" class="flex flex-col items-center gap-1 text-blue-500" data-tab="ranking">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
            <path d="M4 22h16" />
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
          </svg>
          <span class="text-xs">رتبه‌بندی</span>
        </button>

        <button id="profile-btn" class="flex flex-col items-center gap-1 text-gray-500" data-tab="profile">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
            <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
          <span class="text-xs">پروفایل</span>
        </button>
      </nav>
    </footer>
  </div>
  <script src="scripts.js"></script>
</body>

</html>
