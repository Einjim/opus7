<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <title>کوییزینو | ثبت‌نام</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" type="text/css" />
    <style>
        /* --- Unified Core Styles (Unchanged) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazir', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f3f4f6;
        }

        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            text-align: center;
            color: #1f2937;
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"] {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        input[type="email"]:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        button {
            background-color: #3b82f6;
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #2563eb;
        }

        .links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: #4b5563;
        }

        .links a {
            color: #3b82f6;
            text-decoration: none;
            margin: 0 0.25rem;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* --- Styles for this page's unique elements --- */
        .birthday-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-top: 0.5rem;
        }

        .birthday-container label {
            font-size: 0.875rem;
            color: #4b5563;
        }
        
        /* --- MODIFIED: Styles for the new dropdowns --- */
        #birthday-selectors {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        #birthday-selectors select {
            flex-grow: 1; /* Make selects share space equally */
            width: 30%; /* Fallback width */
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            background-color: #f9fafb;
            text-align: center; /* Center the selected value */
            cursor: pointer;
        }

        #birthday-selectors select:focus {
            outline: none;
            border-color: #3b82f6;
        }
    </style>
</head>
<body>
    <div class="container" id="signup-page">
        <h1>ثبت‌نام در کوییزینو</h1>
        <form id="signup-form">
            <input type="text" id="first-name" placeholder="نام" required>
            <input type="text" id="last-name" placeholder="نام خانوادگی" required>
            <input type="tel" id="phone" placeholder="شماره موبایل" pattern="^(\+98|0)?9\d{9}$" required>
            <input type="email" id="email" placeholder="ایمیل (اختیاری)">
            
            <!-- === SECTION MODIFIED === -->
            <div class="birthday-container">
                <label for="birthday">تاریخ تولد</label>
                <div id="birthday-selectors">
                    <!-- Day Selector -->
                    <select id="birth-day" name="birth_day">
                        <!-- Options 1-31 will be generated by JS or can be hardcoded -->
                    </select>
                    
                    <!-- Month Selector (Mapping Persian names to numbers) -->
                    <select id="birth-month" name="birth_month">
                        <option value="01">فروردین</option>
                        <option value="02">اردیبهشت</option>
                        <option value="03">خرداد</option>
                        <option value="04">تیر</option>
                        <option value="05">مرداد</option>
                        <option value="06">شهریور</option>
                        <option value="07">مهر</option>
                        <option value="08">آبان</option>
                        <option value="09">آذر</option>
                        <option value="10">دی</option>
                        <option value="11">بهمن</option>
                        <option value="12">اسفند</option>
                    </select>

                    <!-- Year Selector -->
                    <select id="birth-year" name="birth_year">
                        <!-- Options 1390-1340 will be generated by JS or can be hardcoded -->
                    </select>
                </div>
                <!-- This hidden input will hold the combined date for form submission -->
                <input type="hidden" id="birthday" name="birthday" required>
            </div>
            <!-- === END OF MODIFIED SECTION === -->

            <button type="submit">ادامه</button>
        </form>
        <div class="links">
            <span>حساب کاربری دارید؟</span>
            <a href="/signin">وارد شوید</a>
        </div>
    </div>
    
    <!-- JavaScript to populate dropdowns and handle hidden input -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const daySelect = document.getElementById('birth-day');
            const monthSelect = document.getElementById('birth-month');
            const yearSelect = document.getElementById('birth-year');
            const birthdayInput = document.getElementById('birthday');

            // --- Populate Day Dropdown (1 to 31) ---
            for (let i = 1; i <= 31; i++) {
                // Pad with zero if needed for consistent value format
                const dayValue = i < 10 ? '0' + i : i;
                const option = new Option(i, dayValue);
                daySelect.add(option);
            }
            
            // --- Populate Year Dropdown (1390 down to 1340) ---
            const currentYear = 1390;
            const startYear = 1340;
            for (let i = currentYear; i >= startYear; i--) {
                const option = new Option(i, i);
                yearSelect.add(option);
            }

            // --- Function to update the hidden birthday input ---
            function updateBirthdayValue() {
                const year = yearSelect.value;
                const month = monthSelect.value;
                const day = daySelect.value;
                // Combine them in a format the API expects (e.g., YYYY-MM-DD)
                birthdayInput.value = `${year}-${month}-${day}`;
                console.log('Hidden birthday value set to:', birthdayInput.value);
            }

            // --- Add event listeners to update on any change ---
            daySelect.addEventListener('change', updateBirthdayValue);
            monthSelect.addEventListener('change', updateBirthdayValue);
            yearSelect.addEventListener('change', updateBirthdayValue);

            // --- Set initial value on page load ---
            // Set default selections (e.g., to 1375-01-01)
            yearSelect.value = '1375';
            monthSelect.value = '01';
            daySelect.value = '01';
            updateBirthdayValue();
        });
    </script>
    
    <!-- This assumes your existing script.js handles the form submission -->
    <script src="/static/script.js"></script>
</body>
</html>
